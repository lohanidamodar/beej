name: beej
description: >-
  Plants a new Flutter app — material_ui, Riverpod, go_router,
  en/ne localization, theming, fastlane and the store-screenshot harness,
  with Appwrite, sqflite and the rest as explicit choices.
version: 1.0.0
repository: https://github.com/lohanidamodar/beej

environment:
  sdk: ^3.13.0

executables:
  beej:

dependencies:
  # Command and flag parsing.
  args: ^2.7.0
  # Template rendering. Mustache rather than a hand-rolled substituter so
  # section blocks ({{#appwrite}}…{{/appwrite}}) and escaping are somebody
  # else's problem.
  mustache_template: ^2.0.5
  # Spec-file parsing. `yaml` only reads; beej never rewrites a user's spec.
  yaml: ^3.1.3
  # Surgical edits to beej's own config file, preserving comments and layout.
  # `beej config set` would otherwise have to rewrite the whole file and throw
  # away anything the user had written around their settings.
  yaml_edit: ^2.2.4
  path: ^1.9.1
  # ANSI colours and `sharedStdIn`, for the interactive prompts.
  io: ^1.0.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
